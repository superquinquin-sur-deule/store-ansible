---
- name: Include system configuration components
  ansible.builtin.include_tasks: "{{ task }}"
  loop:
    - tuning.yml
    - journald.yml
    - hostname.yml
    - security.yml
    - exporter.yml
    - motd.yml
    - extras.yml
  loop_control:
    loop_var: task

- name: Trigger handlers now
  meta: flush_handlers
