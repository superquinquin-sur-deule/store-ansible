---
- name: Install pywebdriver with mkcert
  ansible.builtin.package:
    name: "{{ package }}"
    state: present
  loop:
    - mkcert
    - pywebdriver
  loop_control:
    loop_var: package

- name: Generate self-signed certificate
  ansible.builtin.import_tasks: cert.yml
  tags: ["cert"]

- name: Configure pywebdriver
  ansible.builtin.include_tasks: configure.yml
  loop: "{{ pywebdriver_config | dict2items }}"
  loop_control:
    loop_var: section

- name: Grant CAP_NET_BIND_SERVICE to pywebdriver service
  when: pywebdriver_config.flask.port | int in [80, 443]
  ansible.builtin.lineinfile:
    path: /usr/lib/systemd/system/pywebdriver.service
    line: AmbientCapabilities=CAP_NET_BIND_SERVICE
    regexp: '^AmbientCapabilities='
    insertbefore: '^ExecStart='
  notify: restart-pywebdriver
